spring.datasource.url=jdbc:mysql://${User_db_host}:${User_db_port}/${User_db_name}
spring.datasource.username=${User_db_username}
spring.datasource.password=${User_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.client.url=http://${CLIENT_HOST}:${App_client_port}/${Login}
jwt.secret=${JWT_SECRET}
